settings:
  content:
    merge: true

  commit:
    templates:
      create: "Dodaj {path} (Pages CMS)"
      update: "Edytuj {path} (Pages CMS)"


media:

  # =========================
  # ZDJĘCIA AKTUALNOŚCI
  # =========================

  - name: aktualnosci-images
    label: Zdjęcia aktualności
    input: src/content/aktualnosci/_media
    output: ./_media
    extensions: [jpg, jpeg, png, webp]
    rename: safe


  # =========================
  # ZDJĘCIA ZESPOŁU
  # =========================

  - name: zespol-images
    label: Zdjęcia zespołu
    input: src/content/zespol/_media
    output: ./_media
    extensions: [jpg, jpeg, png, webp]
    rename: safe


  # =========================
  # PLIKI MATERIAŁÓW
  # =========================

  - name: materialy-files
    label: Pliki materiałów
    input: public/materialy
    output: /materialy
    extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip]
    rename: safe


  # =========================
  # ZDJĘCIA WYDARZEŃ
  # =========================

  - name: wydarzenia-images
    label: Zdjęcia wydarzeń
    input: src/content/wydarzenia/_media
    output: ./_media
    extensions: [jpg, jpeg, png, webp]
    rename: safe


  # =========================
  # PLIKI WYDARZEŃ
  # =========================

  - name: wydarzenia-files
    label: Pliki wydarzeń
    input: public/pliki-wydarzen
    output: /pliki-wydarzen
    extensions: [pdf]
    rename: safe



content:

  # ============================================================
  # AKTUALNOŚCI
  # ============================================================

  - name: aktualnosci
    label: Aktualności
    type: collection
    path: src/content/aktualnosci
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{data}-{tytul}.md"
      field: false

    operations:
      create: true
      rename: false
      delete: false

    view:
      primary: tytul
      fields: [tytul, data, lead]
      sort: [data]
      default:
        sort: data
        order: desc

    fields:

      - name: tytul
        label: Tytuł
        type: string
        required: true

      - name: data
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: lead
        label: Krótki opis
        type: text
        required: true

      - name: obraz
        label: Zdjęcie (opcjonalne)
        type: image
        required: false
        description: Jeśli nie dodasz zdjęcia, zostanie wyświetlona standardowa grafika projektu.
        options:
          media: aktualnosci-images

      - name: obrazAlt
        label: Opis zdjęcia
        type: string
        required: false
        description: Wypełnij to pole, jeśli dodajesz zdjęcie.

      - name: body
        label: Treść aktualności
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: false



  # ============================================================
  # ZESPÓŁ
  # ============================================================

  - name: zespol
    label: Zespół
    type: collection
    path: src/content/zespol
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{primary}.md"
      field: false

    operations:
      create: true
      rename: false
      delete: false

    view:
      primary: imieNazwisko
      fields: [imieNazwisko, rola, kolejnosc]
      sort: [kolejnosc, imieNazwisko]
      default:
        sort: kolejnosc
        order: asc

    fields:

      - name: imieNazwisko
        label: Imię i nazwisko
        type: string
        required: true

      - name: rola
        label: Rola w projekcie
        type: string
        required: true

      - name: kolejnosc
        label: Kolejność wyświetlania
        type: number
        required: true
        description: "1 = pierwsza osoba, 2 = druga osoba itd."

      - name: afiliacja
        label: Afiliacja
        type: string
        required: false

      - name: email
        label: E-mail
        type: string
        required: false

      - name: orcid
        label: ORCID
        type: string
        required: false
        description: "Pełny adres, np. https://orcid.org/0000-0000-0000-0000"

      - name: bio
        label: Krótki opis na karcie
        type: text
        required: false
        description: Opcjonalny krótki tekst wyświetlany bezpośrednio na karcie osoby.

      - name: foto
        label: Zdjęcie
        type: image
        required: false
        description: Jeśli zdjęcie nie zostanie dodane, strona pokaże placeholder z inicjałami.
        options:
          media: zespol-images

      - name: fotoAlt
        label: Opis zdjęcia
        type: string
        required: false
        description: Jeśli dodajesz zdjęcie, wpisz jego krótki opis.

      - name: body
        label: Pełna nota biograficzna
        type: rich-text
        required: false
        options:
          format: markdown
          media: false



  # ============================================================
  # MATERIAŁY
  # ============================================================

  - name: materialy
    label: Materiały
    type: collection
    path: src/content/materialy
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{data}-{tytul}.md"
      field: false

    operations:
      create: true
      rename: false
      delete: true

    view:
      primary: tytul
      fields: [tytul, data, typ]
      sort: [data, tytul]
      default:
        sort: data
        order: desc

    fields:

      - name: tytul
        label: Tytuł materiału
        type: string
        required: true

      - name: data
        label: Data publikacji
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: typ
        label: Typ materiału
        type: select
        required: true
        options:
          values:
            - name: raport
              label: Raport

            - name: rekomendacje
              label: Rekomendacje

            - name: prezentacja
              label: Prezentacja

            - name: publikacja
              label: Publikacja

            - name: inne
              label: Inny materiał

      - name: plik
        label: Plik
        type: file
        required: true
        description: Wgraj plik, który będzie można pobrać ze strony.
        options:
          media: materialy-files
          extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip]
          rename: safe

      - name: rozmiarKB
        label: Rozmiar pliku w KB
        type: number
        required: true
        description: "Np. dla pliku 2,4 MB wpisz około 2458."

      - name: dostepnyCyfrowo
        label: Dostępny cyfrowo
        type: boolean
        required: true
        default: true



  # ============================================================
  # WYDARZENIA
  # ============================================================

  - name: wydarzenia
    label: Wydarzenia
    type: collection
    path: src/content/wydarzenia
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{primary}.md"
      field: false

    operations:
      create: true
      rename: false
      delete: false

    view:
      primary: tytul
      fields: [tytul, typ, dataStart, opublikowane]
      sort: [dataStart, tytul]
      default:
        sort: dataStart
        order: desc

    fields:

      - name: tytul
        label: Tytuł wydarzenia
        type: string
        required: true

      - name: typ
        label: Typ wydarzenia
        type: select
        required: true
        options:
          values:
            - name: konferencja
              label: Konferencja

            - name: seminarium
              label: Seminarium

            - name: warsztat
              label: Warsztat

            - name: debata
              label: Debata

            - name: inne
              label: Inne wydarzenie

      - name: dataStart
        label: Data rozpoczęcia
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: dataKoniec
        label: Data zakończenia (opcjonalnie)
        type: date
        required: false
        options:
          format: yyyy-MM-dd

      - name: miejsce
        label: Miejsce
        type: string
        required: false

      - name: lead
        label: Krótki opis
        type: text
        required: true

      - name: obraz
        label: Zdjęcie / grafika wydarzenia (opcjonalnie)
        type: image
        required: false
        description: Możesz dodać zdjęcie, grafikę konferencji lub plakat.
        options:
          media: wydarzenia-images

      - name: obrazAlt
        label: Opis zdjęcia
        type: string
        required: false
        description: Wypełnij to pole, jeśli dodajesz zdjęcie lub grafikę.

      - name: program
        label: Program wydarzenia w PDF (opcjonalnie)
        type: file
        required: false
        description: Opcjonalny program konferencji lub innego wydarzenia.
        options:
          media: wydarzenia-files
          extensions: [pdf]
          rename: safe

      - name: opublikowane
        label: Opublikowane na stronie
        type: boolean
        required: true
        default: false
        description: Włącz dopiero wtedy, gdy wydarzenie ma być publicznie dostępne i pojawić się w menu strony.

      - name: body
        label: Treść strony wydarzenia
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: false
